<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" role="img" aria-label="Illustration ONDÉE : la cartouche filtrante C90 est un cylindre de plastique blanc opaque. Les médias filtrants ne sont pas visibles de l'extérieur.">
<defs>
<linearGradient id="pl" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0" stop-color="#D8DEDF"/><stop offset=".22" stop-color="#F7F9F9"/>
  <stop offset=".45" stop-color="#FFFFFF"/><stop offset=".68" stop-color="#EDF1F1"/>
  <stop offset="1" stop-color="#CFD7D8"/>
</linearGradient>
</defs>
<rect width="800" height="800" fill="#F6F4EF"/>

<!-- téton d'entrée -->
<rect x="358" y="150" width="84" height="40" rx="9" fill="url(#pl)" stroke="#B4BEBF" stroke-width="2"/>
<rect x="342" y="186" width="116" height="26" rx="8" fill="url(#pl)" stroke="#B4BEBF" stroke-width="2"/>

<!-- CORPS DE CARTOUCHE : plastique blanc OPAQUE, aucune fenêtre -->
<rect x="286" y="210" width="228" height="410" rx="20" fill="url(#pl)" stroke="#B4BEBF" stroke-width="2"/>
<rect x="312" y="228" width="22" height="374" rx="11" fill="#FFFFFF" opacity=".75"/>
<rect x="470" y="228" width="12" height="374" rx="6" fill="#B4BEBF" opacity=".22"/>

<!-- case à dater, sérigraphiée sur le corps -->
<rect x="326" y="470" width="148" height="72" rx="8" fill="none" stroke="#B4BEBF" stroke-width="2" stroke-dasharray="7 6"/>
<text x="400" y="500" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-size="17" fill="#8A9599">POSÉE LE</text>
<path d="M344 522h112" stroke="#CFD7D8" stroke-width="2"/>

<text x="400" y="300" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-size="26" fill="#5B6B70" letter-spacing="3">C90</text>
<text x="400" y="332" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-size="17" fill="#A8B2B5">90 JOURS</text>

<!-- repère : ce qu'on ne voit pas -->
<g font-family="ui-monospace,Menlo,monospace" font-size="19" fill="#5B6B70">
  <path d="M528 404h48" stroke="#CFC8BA" stroke-width="1"/>
  <text x="584" y="392" font-size="17">Plastique blanc</text>
  <text x="584" y="414" font-size="17">opaque : on ne voit</text>
  <text x="584" y="436" font-size="17">pas les médias.</text>
</g>

<text x="80" y="700" font-family="ui-monospace,Menlo,monospace" font-size="21" fill="#8A9599" letter-spacing="3">ONDÉE</text>
<text x="80" y="732" font-family="ui-monospace,Menlo,monospace" font-size="17" fill="#A8B2B5">Illustration d'après le produit · non contractuel</text>
</svg>
