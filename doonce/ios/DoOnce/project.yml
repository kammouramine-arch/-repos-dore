# XcodeGen spec. Generate the project with:  xcodegen generate   (brew install xcodegen)
# Then open DoOnce.xcodeproj. Requires Xcode 16+ / iOS 17+ deployment.
name: DoOnce
options:
  bundleIdPrefix: app.doonce
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
packages:
  DoOnceCore:
    path: ../DoOnceCore
settings:
  base:
    SWIFT_VERSION: "5.10"
    SWIFT_STRICT_CONCURRENCY: targeted
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: Signal
    DEVELOPMENT_TEAM: ""
targets:
  DoOnce:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Resources
    dependencies:
      - package: DoOnceCore
    info:
      path: Resources/Info.plist
      properties:
        CFBundleDisplayName: DoOnce
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        UILaunchStoryboardName: LaunchScreen
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIUserInterfaceStyle: Automatic
        ITSAppUsesNonExemptEncryption: false
        NSCameraUsageDescription: DoOnce uses the camera to look at objects and to record demonstrations. Nothing is recorded until you press record.
        NSMicrophoneUsageDescription: The microphone hears the explanation while you record. What's said becomes the steps.
        NSSpeechRecognitionUsageDescription: Speech recognition turns the demonstration into steps and lets you say “next” in hands-free mode.
        NSPhotoLibraryUsageDescription: Import a video you already have.
        NSSupportsLiveActivities: true
        UIBackgroundModes: [audio]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.doonce.ios
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        CODE_SIGN_STYLE: Automatic
  DoOnceTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests/DoOnceTests]
    dependencies:
      - target: DoOnce
      - package: DoOnceCore
  DoOnceUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [Tests/DoOnceUITests]
    dependencies:
      - target: DoOnce
schemes:
  DoOnce:
    build:
      targets: { DoOnce: all, DoOnceTests: [test], DoOnceUITests: [test] }
    run:
      config: Debug
      environmentVariables:
        DOONCE_SAMPLE_CONTENT: "1"
    test:
      config: Debug
      targets: [DoOnceTests, DoOnceUITests]
