<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" fill="none" role="img" aria-label="Détail du textile technique RÉVA">
  <defs>
    <linearGradient id="fbBg" x1="90" y1="120" x2="510" y2="480" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F7F8F9"/><stop offset=".5" stop-color="#E6E8EB"/><stop offset="1" stop-color="#C9CDD3"/>
    </linearGradient>
    <pattern id="fbWeave" width="18" height="18" patternUnits="userSpaceOnUse">
      <path d="M0 9h18M9 0v18" stroke="#FFFFFF" stroke-opacity=".55" stroke-width="1"/>
      <path d="M0 0h18v18H0z" fill="#0A0A0B" fill-opacity=".012"/>
    </pattern>
    <radialGradient id="fbShadow" cx="0" cy="0" r="1" gradientTransform="translate(300 512) scale(180 22)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0A0A0B" stop-opacity=".22"/><stop offset="1" stop-color="#0A0A0B" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <ellipse cx="300" cy="512" rx="180" ry="22" fill="url(#fbShadow)"/>

  <rect x="90" y="120" width="420" height="370" rx="40" fill="url(#fbBg)" stroke="#B6BBC2" stroke-width="1.4"/>
  <rect x="90" y="120" width="420" height="370" rx="40" fill="url(#fbWeave)"/>

  <!-- stitching -->
  <g stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round" stroke-dasharray="10 9" opacity=".95">
    <path d="M124 158h352"/>
    <path d="M124 452h352"/>
  </g>
  <g stroke="#C2A26B" stroke-width="2.4" stroke-linecap="round" stroke-dasharray="10 9">
    <path d="M124 305h352"/>
  </g>

  <!-- zip -->
  <path d="M300 158v294" stroke="#9AA0A8" stroke-width="6" stroke-linecap="round" opacity=".35"/>
  <g fill="#B4B9C0">
    <rect x="286" y="292" width="28" height="46" rx="8"/>
  </g>
  <path d="M300 338v26" stroke="#C2A26B" stroke-width="3" stroke-linecap="round"/>
  <circle cx="300" cy="370" r="8" stroke="#C2A26B" stroke-width="3"/>

  <!-- highlight -->
  <path d="M130 190q170-30 340 0" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round" opacity=".55"/>
</svg>
