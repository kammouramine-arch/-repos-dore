<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" fill="none" role="img" aria-label="Bottes de compression RÉVA Circula">
  <defs>
    <linearGradient id="lgBody" x1="214" y1="74" x2="400" y2="520" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FEFDFB"/>
      <stop offset=".45" stop-color="#F1ECE4"/>
      <stop offset="1" stop-color="#DED6CA"/>
    </linearGradient>
    <linearGradient id="lgFace" x1="240" y1="120" x2="360" y2="480" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF" stop-opacity=".9"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="lgShadow" cx="0" cy="0" r="1" gradientTransform="translate(300 540) scale(150 22)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0A0A0B" stop-opacity=".26"/>
      <stop offset="1" stop-color="#0A0A0B" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <ellipse cx="300" cy="540" rx="150" ry="22" fill="url(#lgShadow)"/>

  <!-- hose port -->
  <rect x="330" y="44" width="54" height="30" rx="15" fill="#B99B72"/>
  <rect x="345" y="30" width="24" height="22" rx="11" fill="#C0B8AC"/>

  <!-- sleeve body -->
  <path d="M214 96q0-22 22-22h128q22 0 22 22l-14 390q-2 22-24 22h-96q-22 0-24-22z" fill="url(#lgBody)"/>
  <path d="M214 96q0-22 22-22h128q22 0 22 22l-14 390q-2 22-24 22h-96q-22 0-24-22z" fill="url(#lgFace)"/>
  <path d="M214 96q0-22 22-22h128q22 0 22 22l-14 390q-2 22-24 22h-96q-22 0-24-22z" stroke="#C6BEB2" stroke-width="1.4"/>

  <!-- chambers -->
  <g stroke="#C6BEB2" stroke-width="1.3" opacity=".9">
    <path d="M216 160h168"/>
    <path d="M219 246h162"/>
    <path d="M223 332h155"/>
    <path d="M226 418h148"/>
  </g>

  <!-- chamber shading -->
  <g fill="#0A0A0B" opacity=".04">
    <path d="M216 160h168l-1.5 86H218.5z"/>
    <path d="M223 332h155l-1.5 86H224.5z"/>
  </g>

  <!-- gold zip -->
  <path d="M252 104l7 392" stroke="#B99B72" stroke-width="2.4" stroke-linecap="round"/>
  <circle cx="252" cy="104" r="7" fill="#B99B72"/>
  <rect x="248" y="108" width="8" height="20" rx="4" fill="#B99B72"/>

  <!-- light edge -->
  <path d="M368 92l-13 384" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" opacity=".75"/>

  <!-- logo mark -->
  <circle cx="300" cy="205" r="15" stroke="#9A938A" stroke-width="1.2"/>
  <path d="M294 205h12M300 199v12" stroke="#9A938A" stroke-width="1.2" stroke-linecap="round"/>
</svg>
