<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" fill="none" role="img" aria-label="Masseur oculaire RÉVA Lumen">
  <defs>
    <linearGradient id="eyBody" x1="120" y1="200" x2="480" y2="400" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FCFCFD"/>
      <stop offset=".5" stop-color="#E9EBEE"/>
      <stop offset="1" stop-color="#CDD1D7"/>
    </linearGradient>
    <linearGradient id="eyStrap" x1="80" y1="300" x2="520" y2="300" gradientUnits="userSpaceOnUse">
      <stop stop-color="#3A3D43"/>
      <stop offset=".5" stop-color="#1B1D21"/>
      <stop offset="1" stop-color="#3A3D43"/>
    </linearGradient>
    <radialGradient id="eyGlow" cx="0" cy="0" r="1" gradientTransform="translate(300 300) scale(190 90)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#C2A26B" stop-opacity=".35"/>
      <stop offset="1" stop-color="#C2A26B" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="eyShadow" cx="0" cy="0" r="1" gradientTransform="translate(300 430) scale(175 22)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0A0A0B" stop-opacity=".26"/>
      <stop offset="1" stop-color="#0A0A0B" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <ellipse cx="300" cy="430" rx="175" ry="22" fill="url(#eyShadow)"/>
  <ellipse cx="300" cy="300" rx="230" ry="110" fill="url(#eyGlow)"/>

  <!-- straps -->
  <path d="M150 262H92q-26 0-26 26v24q0 26 26 26h58" stroke="url(#eyStrap)" stroke-width="22" stroke-linecap="round"/>
  <path d="M450 262h58q26 0 26 26v24q0 26-26 26h-58" stroke="url(#eyStrap)" stroke-width="22" stroke-linecap="round"/>

  <!-- mask body -->
  <path d="M148 246q0-38 38-42 114-12 228 0 38 4 38 42v66q0 38-38 44-114 16-228 0-38-6-38-44z" fill="url(#eyBody)"/>
  <path d="M148 246q0-38 38-42 114-12 228 0 38 4 38 42v66q0 38-38 44-114 16-228 0-38-6-38-44z" stroke="#B6BBC2" stroke-width="1.4"/>

  <!-- nose notch -->
  <path d="M270 356q30 26 60 0" stroke="#B6BBC2" stroke-width="1.4" fill="#DCDFE4"/>

  <!-- eye zones -->
  <ellipse cx="226" cy="286" rx="52" ry="38" fill="#0F1113" opacity=".9"/>
  <ellipse cx="374" cy="286" rx="52" ry="38" fill="#0F1113" opacity=".9"/>
  <ellipse cx="226" cy="286" rx="34" ry="22" stroke="#C2A26B" stroke-opacity=".7" stroke-width="1.6"/>
  <ellipse cx="374" cy="286" rx="34" ry="22" stroke="#C2A26B" stroke-opacity=".7" stroke-width="1.6"/>
  <circle cx="226" cy="286" r="6" fill="#C2A26B" opacity=".85"/>
  <circle cx="374" cy="286" r="6" fill="#C2A26B" opacity=".85"/>

  <!-- top highlight -->
  <path d="M186 218q114-10 228 0" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round" opacity=".8"/>

  <!-- control -->
  <rect x="286" y="330" width="28" height="10" rx="5" fill="#B4B9C0"/>
</svg>
