      <stop stop-color="#FDFDFE"/>
      <stop offset=".5" stop-color="#EBEDF0"/>
      <stop offset="1" stop-color="#CFD3D9"/>
    </linearGradient>
    <linearGradient id="ftCav" x1="200" y1="200" x2="400" y2="330" gradientUnits="userSpaceOnUse">
