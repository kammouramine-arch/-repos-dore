<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Ambiance RÉVA">
  <defs>
    <linearGradient id="s3base" x1="0" y1="0" x2="1600" y2="1200" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FBF9F5"/><stop offset=".55" stop-color="#F1EADE"/><stop offset="1" stop-color="#DED4C4"/>
    </linearGradient>
    <radialGradient id="s3light" cx="0" cy="0" r="1" gradientTransform="translate(800 300) scale(780 640)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFDF9" stop-opacity=".92"/><stop offset="1" stop-color="#FFFDF9" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="s3accent" cx="0" cy="0" r="1" gradientTransform="translate(1240 940) scale(580 430)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#B99B72" stop-opacity=".26"/><stop offset="1" stop-color="#B99B72" stop-opacity="0"/>
    </radialGradient>
    <filter id="s3blur" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="75"/></filter>
    <filter id="s3grain"><feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="3"/><feColorMatrix type="saturate" values="0"/></filter>
  </defs>
  <rect width="1600" height="1200" fill="url(#s3base)"/>
