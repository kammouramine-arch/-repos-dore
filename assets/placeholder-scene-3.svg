    <ellipse cx="1240" cy="940" rx="320" ry="230" fill="#B99B72" opacity=".18"/>
  </g>
  <g stroke="#0B0B0C" stroke-opacity=".045" stroke-width="1.4">
    <path d="M0 820C360 760 760 790 1100 860 1360 915 1500 925 1600 900"/>
    <path d="M0 900C360 840 760 870 1100 940 1360 995 1500 1005 1600 980"/>
