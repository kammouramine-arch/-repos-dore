<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Après">
  <defs>
    <linearGradient id="baafterbg" x1="0" y1="0" x2="1600" y2="1000" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F7F5F1"/><stop offset=".6" stop-color="#EDE7DD"/><stop offset="1" stop-color="#DCD2C2"/>
    </linearGradient>
    <radialGradient id="baafterglow" cx="0" cy="0" r="1" gradientTransform="translate(1100 260) scale(700 560)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#C2A26B" stop-opacity=".45"/><stop offset="1" stop-color="#C2A26B" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="baafterleg" x1="600" y1="200" x2="1000" y2="900" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FDFDFD"/><stop offset="1" stop-color="#E6E2DA"/>
    </linearGradient>
    <filter id="baafterblur" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="60"/></filter>
    <filter id="baaftergrain"><feTurbulence type="fractalNoise" baseFrequency=".8" numOctaves="3"/><feColorMatrix type="saturate" values="0"/></filter>
  </defs>

  <rect width="1600" height="1000" fill="url(#baafterbg)"/>
  <rect width="1600" height="1000" fill="url(#baafterglow)"/>

  <g filter="url(#baafterblur)" opacity=".45">
    <ellipse cx="1180" cy="300" rx="320" ry="240" fill="#C2A26B" opacity=".5"/>
  </g>

  <!-- silhouette de jambe stylisée, plein cadre -->
  <g opacity=".92">
    <path d="M690 120c120 0 190 70 196 168l38 470c6 78-46 132-128 132h-96c-82 0-134-54-128-132l38-470c6-98 76-168 196-168z" fill="url(#baafterleg)"/>
    <g stroke="#DCD2C2" stroke-opacity=".5" stroke-width="2">
      <path d="M700 330h204"/><path d="M696 470h212"/><path d="M692 610h220"/><path d="M688 750h228"/>
    </g>
    <path d="M760 150l-18 730" stroke="#C2A26B" stroke-opacity=".9" stroke-width="5" stroke-linecap="round"/>
  </g>

  <g stroke="#0A0A0B" stroke-opacity=".05" stroke-width="1.4">
    <path d="M0 880C360 830 760 855 1100 910 1360 952 1500 960 1600 940"/>
  </g>
  <rect width="1600" height="1000" filter="url(#baaftergrain)" opacity=".05"/>
</svg>
