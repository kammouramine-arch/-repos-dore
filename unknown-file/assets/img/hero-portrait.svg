<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1400" width="900" height="1400" role="img"
 aria-label="A dark headland at night above cold water, with one lit window in a small building and a signal lamp on a mast.">
<defs>
 <filter id="grain"><feTurbulence type="fractalNoise" baseFrequency=".82" numOctaves="4" seed="7" stitchTiles="stitch"/>
  <feColorMatrix type="saturate" values="0"/><feComponentTransfer><feFuncA type="linear" slope=".5"/></feComponentTransfer></filter>
 <filter id="soft"><feGaussianBlur stdDeviation="30"/></filter>
 <filter id="soft2"><feGaussianBlur stdDeviation="9"/></filter>
 <filter id="soft3"><feGaussianBlur stdDeviation="2.6"/></filter>
 <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0" stop-color="#06080D"/><stop offset=".34" stop-color="#0B0F17"/>
  <stop offset=".72" stop-color="#141A25"/><stop offset="1" stop-color="#1A212D"/></linearGradient>
 <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0" stop-color="#101620"/><stop offset=".5" stop-color="#0A0E14"/><stop offset="1" stop-color="#06080B"/></linearGradient>
 <radialGradient id="moon" cx="50%" cy="50%" r="50%">
  <stop offset="0" stop-color="#AEBACB" stop-opacity=".30"/><stop offset="100%" stop-color="#AEBACB" stop-opacity="0"/></radialGradient>
 <radialGradient id="glow" cx="50%" cy="50%" r="50%">
  <stop offset="0" stop-color="#E0C088" stop-opacity=".55"/>
  <stop offset="45%" stop-color="#8A6E44" stop-opacity=".13"/>
  <stop offset="100%" stop-color="#8A6E44" stop-opacity="0"/></radialGradient>
 <radialGradient id="vg" cx="50%" cy="46%" r="74%">
  <stop offset="38%" stop-color="#050607" stop-opacity="0"/><stop offset="100%" stop-color="#050607" stop-opacity=".92"/></radialGradient>
</defs>

 <!-- sky -->
 <rect width="900" height="640" fill="url(#sky)"/>
 <ellipse cx="600" cy="300" rx="420" ry="340" fill="url(#moon)"/>
 <g filter="url(#soft)" opacity=".55">
  <ellipse cx="220" cy="380" rx="400" ry="46" fill="#1A212D"/>
  <ellipse cx="700" cy="330" rx="340" ry="38" fill="#1E2634"/>
  <ellipse cx="430" cy="520" rx="520" ry="34" fill="#121822"/></g>

 <!-- far shore on the horizon -->
 <path d="M0 596 L150 588 L330 594 L520 582 L700 590 L900 584 L900 640 L0 640Z" fill="#080B11"/>

 <!-- sea -->
 <rect y="640" width="900" height="300" fill="url(#sea)"/>
 <g opacity=".2" fill="#8FA0B8">
  <rect x="60" y="676" width="150" height="1"/><rect x="330" y="712" width="230" height="1"/>
  <rect x="640" y="690" width="170" height="1"/><rect x="150" y="778" width="260" height="1"/>
  <rect x="560" y="828" width="240" height="1"/><rect x="240" y="884" width="200" height="1"/></g>

 <!-- headland the viewer stands on -->
 <path d="M0 940 C160 902 300 918 430 900 C580 880 700 902 900 878 L900 1400 L0 1400Z" fill="#05070B"/>
 <path d="M0 940 C160 902 300 918 430 900 C580 880 700 902 900 878" fill="none" stroke="#1B2331" stroke-width="2" opacity=".5"/>

 <!-- the station, on the ridge -->
 <g transform="translate(232 700) scale(1.55)">
  <ellipse cx="86" cy="70" rx="230" ry="120" fill="url(#glow)"/>
  <rect x="0" y="26" width="150" height="66" fill="#03040A"/>
  <path d="M-8 26 L75 -4 L158 26Z" fill="#03040A"/>
  <rect x="20" y="46" width="21" height="18" fill="#EBCE96"/>
  <rect x="20" y="46" width="21" height="18" fill="#EBCE96" opacity=".6" filter="url(#soft3)"/>
  <rect x="60" y="46" width="21" height="18" fill="#8E7C58" opacity=".26"/>
  <rect x="0" y="88" width="150" height="6" fill="#010204"/>
  <rect x="196" y="-64" width="3" height="156" fill="#080B12"/>
  <rect x="186" y="-64" width="22" height="3" fill="#080B12"/>
  <circle cx="197" cy="-72" r="4.5" fill="#D9202B" opacity=".9"/>
  <circle cx="197" cy="-72" r="12" fill="#B4121C" opacity=".45" filter="url(#soft3)"/>
 </g>

 <!-- lamp spill down the slope -->
 <g opacity=".22">
  <ellipse cx="330" cy="960" rx="200" ry="46" fill="#C9A96E" filter="url(#soft2)"/></g>

 <rect width="900" height="1400" fill="url(#vg)"/>
 <rect width="900" height="1400" filter="url(#grain)" opacity=".07" style="mix-blend-mode:overlay"/>
</svg>
