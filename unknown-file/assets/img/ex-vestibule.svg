<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1050" width="1400" height="1050" role="img"
 aria-label="Scene photograph: a station vestibule with a rack of five hooks, one navy coat, a pair of rubber boots, and a scale card on the floor.">
<defs>
  <filter id="grain"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="4" seed="53" stitchTiles="stitch"/>
    <feColorMatrix type="saturate" values="0"/><feComponentTransfer><feFuncA type="linear" slope=".55"/></feComponentTransfer></filter>
  <filter id="soft"><feGaussianBlur stdDeviation="22"/></filter>
  <filter id="soft2"><feGaussianBlur stdDeviation="6"/></filter>
  <filter id="soft3"><feGaussianBlur stdDeviation="2"/></filter>
  <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1C1E20"/><stop offset="1" stop-color="#101214"/></linearGradient>
 <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#191B1D"/><stop offset="1" stop-color="#0A0B0D"/></linearGradient>
 <linearGradient id="coat" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#232C3C"/><stop offset="1" stop-color="#131822"/></linearGradient>
 <radialGradient id="flash" cx="46%" cy="30%" r="66%"><stop offset="0" stop-color="#FFFFFF" stop-opacity=".14"/><stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/></radialGradient></defs>
  <rect width="1400" height="1050" fill="url(#wall)"/>
  <rect y="760" width="1400" height="290" fill="url(#floor)"/>
  <path d="M0 760 H1400" stroke="#050608" stroke-width="4"/>
  <rect width="1400" height="1050" fill="url(#flash)"/>
  <!-- rack rail -->
  <rect x="200" y="330" width="1000" height="18" fill="#20242A"/>
  <rect x="200" y="348" width="1000" height="5" fill="#0A0C0F"/>
  <g fill="#2A2F36">
    <rect x="262" y="348" width="14" height="40"/><rect x="256" y="384" width="26" height="10"/>
    <rect x="462" y="348" width="14" height="40"/><rect x="456" y="384" width="26" height="10"/>
    <rect x="662" y="348" width="14" height="40"/><rect x="656" y="384" width="26" height="10"/>
    <rect x="862" y="348" width="14" height="40"/><rect x="856" y="384" width="26" height="10"/>
    <rect x="1062" y="348" width="14" height="40"/><rect x="1056" y="384" width="26" height="10"/></g>
  <!-- hook 1: Reyes jacket (dark, partly out of frame) -->
  <path d="M226 384 q42 -14 84 0 l30 250 q-72 22 -144 0 Z" fill="#15181D"/>
  <!-- hook 2: THE navy coat, tagged STN-04 -->
  <g>
    <path d="M420 386 q56 -20 112 0 l44 340 q-100 30 -200 0 Z" fill="url(#coat)"/>
    <path d="M476 386 l0 340" stroke="#0C1017" stroke-width="3" opacity=".7"/>
    <path d="M420 386 q56 42 112 0" fill="none" stroke="#0C1017" stroke-width="3" opacity=".6"/>
    <!-- the tag -->
    <g transform="translate(534 404) rotate(6)">
      <rect width="72" height="34" fill="#E2DED3"/>
      <text x="36" y="23" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="17" letter-spacing="1" fill="#26261F">STN-04</text></g>
  </g>
  <!-- hooks 3 empty, 4 Vance jacket, 5 empty -->
  <path d="M826 384 q40 -14 80 0 l26 220 q-66 20 -132 0 Z" fill="#191D23"/>
  <!-- boots -->
  <g transform="translate(408 726)">
    <path d="M0 0 h64 v92 q0 20 24 22 h34 v42 H0 Z" fill="#0F1215"/>
    <path d="M86 0 h64 v92 q0 20 24 22 h34 v42 H86 Z" fill="#12161A"/>
    <rect x="-2" y="152" width="212" height="10" fill="#07090B"/>
    <g transform="translate(150 -16) rotate(-4)"><rect width="66" height="30" fill="#E2DED3"/>
      <text x="33" y="21" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="15" fill="#26261F">STN-04</text></g>
  </g>
  <!-- scale card -->
  <g transform="translate(900 880)">
    <rect width="300" height="90" fill="#E4E0D6"/>
    <g fill="#1A1A17"><rect x="14" y="16" width="34" height="34"/><rect x="82" y="16" width="34" height="34"/>
      <rect x="48" y="50" width="34" height="34"/><rect x="116" y="50" width="34" height="34"/></g>
    <text x="170" y="42" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="19" letter-spacing="2" fill="#26261F">EX-17</text>
    <text x="170" y="70" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="15" letter-spacing="2" fill="#4A4A44">100 mm</text>
    <rect x="170" y="76" width="100" height="4" fill="#26261F"/>
  </g>
  <!-- door edge -->
  <rect x="1240" y="120" width="160" height="700" fill="#0A0C0F"/>
  <rect x="1240" y="120" width="8" height="700" fill="#2A2F36"/>
  <radialGradient id="vg" cx="46%" cy="40%" r="76%"><stop offset="44%" stop-color="#050607" stop-opacity="0"/><stop offset="100%" stop-color="#050607" stop-opacity=".78"/></radialGradient><rect width="1400" height="1050" fill="url(#vg)"/>
  <rect width="1400" height="1050" filter="url(#grain)" opacity=".085" style="mix-blend-mode:overlay"/>
  
  <g fill="none" stroke="#ECEAE5" stroke-width="2" opacity=".26">
    <path d="M28 66 V28 H66"/><path d="M1334 28 H1372 V66"/>
    <path d="M1372 984 V1022 H1334"/><path d="M66 1022 H28 V984"/>
  </g>
  <text x="40" y="1010" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="20" letter-spacing="4" fill="#ECEAE5" opacity=".5">EX-17</text>
  <text x="1360" y="1010" text-anchor="end" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="20" letter-spacing="3" fill="#ECEAE5" opacity=".34">04 FEB 2009  09:52</text>
</svg>
