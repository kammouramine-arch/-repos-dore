<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img"
     aria-label="A single lit sash window in the dark facade of a guest house.">
<defs>
  <filter id="grain" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency=".82" numOctaves="4" seed="17" stitchTiles="stitch"/>
    <feColorMatrix type="saturate" values="0"/>
    <feComponentTransfer><feFuncA type="linear" slope=".5"/></feComponentTransfer>
  </filter>
  <filter id="soft"><feGaussianBlur stdDeviation="26"/></filter>
  <filter id="soft2"><feGaussianBlur stdDeviation="7"/></filter>
  <filter id="soft3"><feGaussianBlur stdDeviation="2.2"/></filter>
  
  <linearGradient id="wall" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#101319"/><stop offset="1" stop-color="#080A0E"/></linearGradient>
  <linearGradient id="pane" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#F0DDB4" stop-opacity=".92"/>
    <stop offset="1" stop-color="#C6A874" stop-opacity=".72"/></linearGradient>
  <radialGradient id="spill" cx="50%" cy="50%" r="50%">
    <stop offset="0" stop-color="#E6C894" stop-opacity=".35"/>
    <stop offset="100%" stop-color="#E6C894" stop-opacity="0"/></radialGradient>
</defs>
  <rect width="1200" height="900" fill="url(#wall)"/>
  <g opacity=".5" stroke="#05070A" stroke-width="1.5">
    <path d="M0 150 H1200"/><path d="M0 300 H1200"/><path d="M0 450 H1200"/>
    <path d="M0 600 H1200"/><path d="M0 750 H1200"/>
    <path d="M240 0 V900"/><path d="M600 0 V900"/><path d="M960 0 V900"/>
  </g>
  <ellipse cx="600" cy="430" rx="480" ry="400" fill="url(#spill)"/>
  <g transform="translate(432 250)">
    <rect x="-22" y="-22" width="380" height="404" fill="#05070A"/>
    <rect x="0" y="0" width="336" height="360" fill="url(#pane)"/>
    <rect x="0" y="0" width="336" height="360" fill="#0A0C11" opacity=".14"/>
    <g fill="#05070A">
      <rect x="160" y="0" width="14" height="360"/>
      <rect x="0" y="172" width="336" height="16"/>
      <rect x="-6" y="352" width="348" height="18"/>
    </g>
    <!-- a shape behind the glass, unresolved on purpose -->
    <ellipse cx="96" cy="232" rx="46" ry="62" fill="#8D7550" opacity=".34" filter="url(#soft2)"/>
    <rect x="196" y="196" width="112" height="150" fill="#7E6845" opacity=".18" filter="url(#soft2)"/>
  </g>
  <rect y="820" width="1200" height="80" fill="#04050A"/>
  <radialGradient id="vg" cx="50%" cy="44%" r="78%"><stop offset="38%" stop-color="#050607" stop-opacity="0"/><stop offset="100%" stop-color="#050607" stop-opacity=".86"/></radialGradient><rect width="1200" height="900" fill="url(#vg)"/>
  <rect width="1200" height="900" filter="url(#grain)" opacity=".1" style="mix-blend-mode:overlay"/>
</svg>
