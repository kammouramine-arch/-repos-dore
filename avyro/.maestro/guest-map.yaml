appId: app.avyro.companion
---
- launchApp:
    clearState: true
    permissions:
      all: allow
- assertVisible: "Your voice. Your way."
- takeScreenshot: build/screens/01-voice-invitation
- waitForAnimationToEnd
- tapOn:
    text: "Continue without hands-free"
    retryTapIfNoChange: true
- takeScreenshot: build/screens/02-after-invitation
- assertVisible: "Search for a destination"
- assertNotVisible: "Welcome back"
- waitForAnimationToEnd
- takeScreenshot: build/screens/02-guest-map
- tapOn: "Report an incident"
- assertVisible: "What did you see?"
- assertVisible: "Report Crash"
- takeScreenshot: build/screens/07-report-menu
- tapOn: "Close"
- tapOn: "Parking"
- extendedWaitUntil:
    visible:
      id: "nearby-result-0"
    timeout: 30000
- takeScreenshot: build/screens/08-parking-map
- tapOn: "Back to map"
- tapOn: "Settings"
- assertVisible: "Optional account"
- assertVisible: "Voice language"
- takeScreenshot: build/screens/03-settings
- tapOn: "Go back"
- tapOn: "Search for a destination"
- tapOn: "Destination"
- inputText: "Eiffel Tower Paris France"
- hideKeyboard
- extendedWaitUntil:
    visible:
      id: "place-result-0"
    timeout: 20000
- takeScreenshot: build/screens/04-address-results
- tapOn:
    id: "place-result-0"
- extendedWaitUntil:
    visible: "Start navigation"
    timeout: 30000
- takeScreenshot: build/screens/05-route-preview
- tapOn: "Start navigation"
- setLocation:
    latitude: 48.8566
    longitude: 2.3522
- extendedWaitUntil:
    visible: "End"
    timeout: 60000
- extendedWaitUntil:
    notVisible: "Waiting for GPS…"
    timeout: 60000
- takeScreenshot: build/screens/06-guidance

- tapOn: "Trip details"
- assertVisible: "Your trip"
- assertVisible: "Add a stop"
- assertVisible: "Parking stop"
- takeScreenshot: build/screens/09-trip-details
- tapOn: "Parking stop"
- extendedWaitUntil:
    visible:
      id: "nearby-result-0"
    timeout: 30000
- tapOn:
    id: "nearby-result-0"
- extendedWaitUntil:
    visible: "End"
    timeout: 30000
- tapOn: "Trip details"
- assertVisible: "Stop 1:.*"
- takeScreenshot: build/screens/10-trip-with-stop
- tapOn: "Back to navigation"
