appId: app.avyro.companion
---
- launchApp:
    clearState: true
    permissions:
      all: allow
- extendedWaitUntil:
    visible: "Continue without hands-free"
    timeout: 90000
- tapOn:
    text: "Continue without hands-free"
    waitToSettleTimeoutMs: 1000
- assertVisible: "Search for a destination"
- tapOn: "Search for a destination"
- tapOn: "Destination"
- inputText: "Eiffel Tower Paris France"
- hideKeyboard
- extendedWaitUntil:
    visible:
      id: "place-result-0"
    timeout: 20000
- takeScreenshot: build/screens/04-address-results
- tapOn:
    id: "place-result-0"
- extendedWaitUntil:
    visible: "Start navigation"
    timeout: 30000
- takeScreenshot: build/screens/05-route-preview
- tapOn: "Start navigation"
# The native workflow already streams fresh positions. A one-shot location reset
# here can interrupt that stream precisely when guidance takes ownership of GPS.
- extendedWaitUntil:
    visible: "End"
    timeout: 60000
- extendedWaitUntil:
    notVisible: "Waiting for GPS…"
    timeout: 60000
- takeScreenshot: build/screens/06-guidance
- extendedWaitUntil:
    visible:
      id: "gps-speed-value"
      text: "0"
    timeout: 15000
- takeScreenshot: build/screens/06-stationary-zero

- tapOn: "Trip details"
- assertVisible: "Your trip"
- assertVisible: "Add a stop"
- assertVisible: "Parking stop"
- extendedWaitUntil:
    visible: "Community observations · unverified"
    timeout: 30000
- takeScreenshot: build/screens/09-trip-details
- swipe:
    from:
      id: "trip-sheet-drag-handle"
    direction: DOWN
    duration: 500
- extendedWaitUntil:
    notVisible: "Your trip"
    timeout: 10000
- tapOn: "Trip details"
- assertVisible: "Your trip"
- tapOn: "Parking stop"
- extendedWaitUntil:
    visible:
      id: "nearby-result-0"
    timeout: 30000
# Only the bottom list scrolls; the screen centre belongs to the map.
- repeat:
    times: 6
    commands:
      - runFlow:
          when:
            notVisible:
              id: "nearby-result-6"
          commands:
            - swipe:
                start: 50%, 90%
                end: 50%, 75%
                duration: 700
- assertVisible:
    id: "nearby-result-6"
- takeScreenshot: build/screens/10-parking-stop-choice
- tapOn:
    id: "nearby-result-6"
- extendedWaitUntil:
    visible: "End"
    timeout: 30000
- tapOn: "Trip details"
- assertVisible: "Stop 1:.*"
- takeScreenshot: build/screens/10-trip-with-stop
- swipe:
    from:
      id: "trip-sheet-drag-handle"
    direction: DOWN
    duration: 500
- assertNotVisible: "Your trip"
