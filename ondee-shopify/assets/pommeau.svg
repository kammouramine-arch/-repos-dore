<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" role="img" aria-label="Illustration ONDÉE : le filtre chromé se visse entre le flexible de douche et la pomme de douche. Corps opaque, sans fenêtre.">
<defs>
<linearGradient id="ch" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0" stop-color="#A9BABF"/><stop offset=".16" stop-color="#E9F0F1"/>
  <stop offset=".33" stop-color="#FFFFFF"/><stop offset=".52" stop-color="#D4E0E3"/>
  <stop offset=".72" stop-color="#8FA5AC"/><stop offset=".88" stop-color="#E1E9EA"/>
  <stop offset="1" stop-color="#A4B6BB"/>
</linearGradient>
<linearGradient id="fx" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0" stop-color="#9FB0B5"/><stop offset=".3" stop-color="#DCE5E7"/>
  <stop offset=".6" stop-color="#B4C3C7"/><stop offset="1" stop-color="#93A6AC"/>
</linearGradient>
</defs>
<rect width="800" height="1000" fill="#F6F4EF"/>

<!-- platine murale -->
<rect x="96" y="150" width="54" height="76" rx="12" fill="url(#ch)" stroke="#7E9299" stroke-width="2"/>

<!-- flexible : opaque, sans transparence -->
<path d="M150 188 C 300 188, 316 250, 336 330" fill="none" stroke="#7E9299" stroke-width="34" stroke-linecap="round" opacity=".28"/>
<path d="M150 188 C 300 188, 316 250, 336 330" fill="none" stroke="url(#fx)" stroke-width="26" stroke-linecap="round"/>
<path d="M150 188 C 300 188, 316 250, 336 330" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" opacity=".55"
      stroke-dasharray="3 13"/>

<!-- raccord haut -->
<rect x="322" y="330" width="72" height="44" rx="7" fill="url(#ch)" stroke="#7E9299" stroke-width="2"/>
<g opacity=".5" stroke="#7E9299" stroke-width="2">
  <path d="M328 340h60M328 350h60M328 360h60"/>
</g>

<!-- collerette moletée -->
<rect x="286" y="374" width="144" height="34" rx="10" fill="url(#ch)" stroke="#7E9299" stroke-width="2"/>
<g opacity=".45" stroke="#7E9299" stroke-width="2">
  <path d="M296 380v22M308 380v22M320 380v22M332 380v22M344 380v22M356 380v22M368 380v22M380 380v22M392 380v22M404 380v22M416 380v22"/>
</g>

<!-- CORPS DU FILTRE : chromé, opaque, aucune fenêtre -->
<rect x="300" y="408" width="116" height="166" rx="22" fill="url(#ch)" stroke="#7E9299" stroke-width="2"/>
<!-- bague de dévissage -->
<path d="M300 466h116" stroke="#7E9299" stroke-width="4" opacity=".6"/>
<!-- reflet vertical, pour dire « métal » et non « verre » -->
<rect x="318" y="420" width="13" height="142" rx="6" fill="#FFFFFF" opacity=".5"/>

<!-- raccord bas -->
<rect x="322" y="574" width="72" height="42" rx="7" fill="url(#ch)" stroke="#7E9299" stroke-width="2"/>
<g opacity=".5" stroke="#7E9299" stroke-width="2">
  <path d="M328 584h60M328 594h60M328 604h60"/>
</g>

<!-- pomme de douche : le client garde la sienne -->
<path d="M358 616 L 358 664" stroke="#7E9299" stroke-width="16" stroke-linecap="round" opacity=".55"/>
<ellipse cx="358" cy="710" rx="128" ry="46" fill="url(#ch)" stroke="#7E9299" stroke-width="2"/>
<ellipse cx="358" cy="702" rx="112" ry="36" fill="#EEF3F4" opacity=".8"/>
<g fill="#7E9299" opacity=".42">
  <circle cx="300" cy="700" r="4"/><circle cx="330" cy="694" r="4"/><circle cx="360" cy="691" r="4"/>
  <circle cx="390" cy="694" r="4"/><circle cx="420" cy="700" r="4"/>
  <circle cx="316" cy="712" r="4"/><circle cx="346" cy="708" r="4"/><circle cx="376" cy="708" r="4"/><circle cx="406" cy="712" r="4"/>
</g>
<g stroke="#9FC7D2" stroke-width="3" stroke-linecap="round" opacity=".65">
  <path d="M310 762v34"/><path d="M348 762v46"/><path d="M386 762v34"/><path d="M424 766v26"/><path d="M272 766v26"/>
</g>

<!-- repères -->
<g font-family="ui-monospace,Menlo,monospace" font-size="19" fill="#5B6B70">
  <path d="M440 391h74" stroke="#CFC8BA" stroke-width="1"/>
  <text x="522" y="396">collerette moletée</text>
  <path d="M440 466h74" stroke="#CFC8BA" stroke-width="1"/>
  <text x="522" y="471">bague de dévissage</text>
  <path d="M440 520h74" stroke="#CFC8BA" stroke-width="1"/>
  <text x="522" y="516">corps chromé,</text>
  <text x="522" y="540">opaque</text>
</g>
<text x="96" y="906" font-family="ui-monospace,Menlo,monospace" font-size="21" fill="#8A9599" letter-spacing="3">ONDÉE</text>
<text x="96" y="940" font-family="ui-monospace,Menlo,monospace" font-size="17" fill="#A8B2B5">Illustration d'après le produit · non contractuel</text>
</svg>
