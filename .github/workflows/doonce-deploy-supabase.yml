name: DoOnce — deploy gateway

# Deploys the DoOnce AI gateway (Supabase Edge Function `doonce-analyze`) after its tests pass.
# Deployment only runs when started by hand (workflow_dispatch); pushes to main only run the tests.
#
# Required repository secrets:
#   SUPABASE_ACCESS_TOKEN          Supabase dashboard → Account → Access Tokens (account-level).
#   DOONCE_SUPABASE_PROJECT_REF    The ref of DoOnce's OWN Supabase project (from its URL,
#                                  https://<ref>.supabase.co). Deliberately a DoOnce-specific name:
#                                  SUPABASE_PROJECT_REF in this repository belongs to another product
#                                  (LifeOS) and must never receive this function. The workflow fails
#                                  if the DoOnce secret is missing or equals that ref.
#
# Set once on the DoOnce project itself (never in the repository, never in the app):
#   supabase secrets set ANTHROPIC_API_KEY=<model key> DOONCE_APPLE_AUDIENCE=app.doonce.ios --project-ref <doonce ref>
# DOONCE_AUTH_MODE must never be set to "dev" on a deployed function.
#
# The function is deployed with --no-verify-jwt (also `verify_jwt = false` in
# doonce/backend/supabase/config.toml): the platform's JWT check only accepts Supabase-issued JWTs
# and would reject the Sign in with Apple identity token the app sends; the function verifies that
# token itself.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["doonce/backend/**"]

defaults:
  run:
    working-directory: doonce/backend

jobs:
  test:
    name: Test gateway
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci || npm install
      - run: npm run typecheck
      - run: npm test

  deploy:
    name: Deploy to DoOnce's Supabase project
    needs: test
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      DOONCE_PROJECT_REF: ${{ secrets.DOONCE_SUPABASE_PROJECT_REF }}
      # Read only to refuse deploying into the other product's project; never deployed to.
      OTHER_PRODUCT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4
      - name: Check the deploy target
        run: |
          missing=0
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Repository secret SUPABASE_ACCESS_TOKEN is not set."
            missing=1
          fi
          if [ -z "$DOONCE_PROJECT_REF" ]; then
            echo "::error::Repository secret DOONCE_SUPABASE_PROJECT_REF is not set. Set it to the ref of DoOnce's own Supabase project. SUPABASE_PROJECT_REF is deliberately not used: it belongs to another product."
            missing=1
          fi
          [ "$missing" = "0" ] || exit 1
          if ! printf '%s' "$DOONCE_PROJECT_REF" | grep -Eq '^[a-z0-9]+$'; then
            echo "::error::DOONCE_SUPABASE_PROJECT_REF must be a bare project ref (lowercase letters and digits), not a URL."
            exit 1
          fi
          if [ -n "$OTHER_PRODUCT_REF" ] && [ "$DOONCE_PROJECT_REF" = "$OTHER_PRODUCT_REF" ]; then
            echo "::error::DOONCE_SUPABASE_PROJECT_REF is the same project as SUPABASE_PROJECT_REF (another product's production project). Refusing to deploy."
            exit 1
          fi
      - uses: supabase/setup-cli@v1
        with: { version: latest }
      - name: Deploy the gateway function
        # Runs from doonce/backend so the CLI picks up supabase/config.toml (verify_jwt, import map).
        run: supabase functions deploy doonce-analyze --project-ref "$DOONCE_PROJECT_REF" --no-verify-jwt
      - name: Smoke check /health
        run: |
          url="https://$DOONCE_PROJECT_REF.supabase.co/functions/v1/doonce-analyze/health"
          for attempt in 1 2 3 4 5 6; do
            if curl -fsS --max-time 20 "$url"; then
              echo
              echo "Health check passed on attempt $attempt."
              exit 0
            fi
            echo "Attempt $attempt failed; retrying in 10 s."
            sleep 10
          done
          echo "::error::$url did not answer 200. Check the function logs in the Supabase dashboard and that ANTHROPIC_API_KEY is set on the function (it refuses to start without it)."
          exit 1
      - name: Summary
        run: |
          {
            echo "### DoOnce gateway"
            echo ""
            echo "Gateway URL for the app (\`DoOnceGatewayURL\`):"
            echo ""
            echo "    https://$DOONCE_PROJECT_REF.supabase.co/functions/v1/doonce-analyze"
            echo ""
            echo "The app calls \`{gateway}/v1/analyze\` and \`{gateway}/v1/account\`; \`{gateway}/health\` is open."
            echo "The function needs \`ANTHROPIC_API_KEY\` and \`DOONCE_APPLE_AUDIENCE=app.doonce.ios\` set with \`supabase secrets set\`."
          } >> "$GITHUB_STEP_SUMMARY"
