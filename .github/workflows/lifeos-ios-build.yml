name: LifeOS — iOS build and submit

# Produces the App Store build and, optionally, uploads it to TestFlight.
#
# EAS Build runs on Expo's macOS workers, so no Mac is needed here — but the build
# is authenticated as you, which is why it needs a token.
#
# Required repository secret:
#   EXPO_TOKEN   expo.dev → Account settings → Access tokens → Create token
#
# Required only for the submit step (App Store Connect API key):
#   ASC_KEY_ID       App Store Connect → Users and Access → Integrations → App Store Connect API
#   ASC_ISSUER_ID    the Issuer ID shown on that same page
#   ASC_PRIVATE_KEY  the contents of the AuthKey_XXXXXXXXXX.p8 file
#
# Signing credentials (distribution certificate and provisioning profile) are managed
# by EAS itself and are generated on the first run.
on:
  workflow_dispatch:
    inputs:
      profile:
        description: 'EAS build profile'
        type: choice
        options: ['production', 'preview']
        default: 'production'
      submit:
        description: 'Upload the finished build to TestFlight'
        type: boolean
        default: false

defaults:
  run:
    working-directory: lifeos

jobs:
  build:
    name: Build iOS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check this branch contains LifeOS
        working-directory: .
        run: |
          if [ ! -f lifeos/eas.json ]; then
            echo "::error::This branch has no lifeos/eas.json. Choose the LifeOS branch in 'Use workflow from'."
            exit 1
          fi

      - name: Check the Expo token is present
        run: |
          if [ -z "${{ secrets.EXPO_TOKEN }}" ]; then
            echo "::error::Repository secret EXPO_TOKEN is not set. Create one at expo.dev → Account settings → Access tokens."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: lifeos/package-lock.json

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      # The gate that matters: a red suite means a build nobody should submit.
      - name: Verify before building
        run: |
          npm run typecheck
          npm run lint
          npm test -- --ci

      # The unit suite proves the config is self-consistent; this proves the outside
      # world agrees — the legal pages Apple opens resolve, the backend the binary
      # embeds answers, and production auth is not left open. Each has cost a cycle.
      - name: Preflight against live services
        run: npm run preflight

      - name: Build
        run: eas build --platform ios --profile "${{ inputs.profile }}" --non-interactive --wait

      - name: Upload to TestFlight
        if: ${{ inputs.submit }}
        env:
          EXPO_ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          EXPO_ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          EXPO_ASC_API_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: |
          if [ -z "$EXPO_ASC_KEY_ID" ] || [ -z "$EXPO_ASC_ISSUER_ID" ] || [ -z "$EXPO_ASC_API_KEY" ]; then
            echo "::error::Submission needs ASC_KEY_ID, ASC_ISSUER_ID and ASC_PRIVATE_KEY as repository secrets."
            exit 1
          fi
          eas submit --platform ios --profile production --latest --non-interactive

      - name: Summary
        run: |
          {
            echo "### LifeOS iOS build"
            echo ""
            echo "- Profile: ${{ inputs.profile }}"
            echo "- Submitted to TestFlight: ${{ inputs.submit }}"
            echo ""
            echo "Builds are listed at https://expo.dev → your project → Builds."
          } >> "$GITHUB_STEP_SUMMARY"
