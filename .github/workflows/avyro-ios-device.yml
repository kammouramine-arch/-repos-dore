name: Avyro signed iPhone build
on:
  push:
    branches: [chatgpt/avyro-v2-foundation-20261013]
    paths: ['.github/workflows/avyro-ios-device.yml']
  workflow_dispatch:
    inputs:
      build_number:
        description: Unused App Store Connect build number
        required: true
        default: '36'
        type: string
      ipa_run:
        description: Optional signed build to reuse when native sources are unchanged
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: avyro-device-${{ github.ref }}
  cancel-in-progress: false
jobs:
  device:
    if: github.repository == 'kammouramine-arch/-repos-dore' && (github.ref == 'refs/heads/chatgpt/avyro-v2-foundation-20261013' || github.ref == 'refs/heads/chatgpt/meepmeep-v2-20261016' || github.ref == 'refs/heads/claude/nova-sprint-1-setup-5g1ky1')
    runs-on: macos-26
    timeout-minutes: 60
    defaults:
      run:
        working-directory: avyro
    env:
      EXPO_PUBLIC_BACKEND_URL: https://avyro-gateway.avyro-cloud-gateway.workers.dev
      EXPO_PUBLIC_ROAD_DATA_ENABLED: 'true'
      BUILD_NUMBER: ${{ inputs.build_number || '36' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: avyro/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npx expo prebuild --platform ios --no-install
        if: ${{ !inputs.ipa_run }}
      - run: pod install --project-directory=ios
        if: ${{ !inputs.ipa_run }}
      - name: Set release build number
        if: ${{ !inputs.ipa_run }}
        run: |
          [[ "$BUILD_NUMBER" =~ ^[1-9][0-9]{0,6}$ ]] || exit 1
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BUILD_NUMBER" ios/meepmeep/Info.plist
      - name: Archive for iPhone
        if: ${{ !inputs.ipa_run }}
        run: |
          set -o pipefail
          xcodebuild -workspace ios/meepmeep.xcworkspace -scheme meepmeep -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -archivePath build/Avyro.xcarchive -derivedDataPath build/device archive CODE_SIGNING_ALLOWED=NO CURRENT_PROJECT_VERSION="$BUILD_NUMBER" > native-device-build.log 2>&1 || { tail -n 100 native-device-build.log; exit 1; }
      - name: Verify native compatibility before reuse
        if: ${{ inputs.ipa_run }}
        env:
          SOURCE_RUN: ${{ inputs.ipa_run }}
          GH_TOKEN: ${{ github.token }}
        run: |
          [[ "$SOURCE_RUN" =~ ^[0-9]+$ ]] || exit 1
          [[ "$BUILD_NUMBER" =~ ^[1-9][0-9]{0,6}$ ]] || exit 1
          SOURCE_SHA=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN" --jq '.head_sha')
          git fetch origin "$SOURCE_SHA" --depth=1
          git diff --exit-code "$SOURCE_SHA" HEAD -- modules package.json package-lock.json app.config.ts scripts plugins
      - name: Download existing signed native container
        if: ${{ inputs.ipa_run }}
        uses: actions/download-artifact@v4
        with:
          name: Avyro-signed-iPhone
          run-id: ${{ inputs.ipa_run }}
          github-token: ${{ github.token }}
          path: avyro/build/reused
      - name: Embed current screens in the verified native container
        if: ${{ inputs.ipa_run }}
        run: |
          mkdir -p build/Avyro.xcarchive/Products/Applications
          unzip -q build/reused/*.ipa -d build/reused/unpacked
          cp -R build/reused/unpacked/Payload/meepmeep.app build/Avyro.xcarchive/Products/Applications/
          APP_PATH=build/Avyro.xcarchive/Products/Applications/meepmeep.app
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP_PATH/Info.plist")" = app.avyro.companion
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BUILD_NUMBER" "$APP_PATH/Info.plist"
          npx expo export:embed --entry-file index.ts --platform ios --dev false --bytecode --bundle-output "$APP_PATH/main.jsbundle" --assets-dest "$APP_PATH"
      - name: Sign with existing Apple distribution credentials
        env:
          CERTIFICATE: ${{ secrets.AVYRO_SIGNING_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.AVYRO_SIGNING_P12_PASSWORD }}
          PROFILE: ${{ secrets.AVYRO_SIGNING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$CERTIFICATE" && test -n "$CERTIFICATE_PASSWORD" && test -n "$PROFILE"
          SIGNING_DIR="$RUNNER_TEMP/avyro-signing"
          mkdir -p "$SIGNING_DIR"
          printf '%s' "$CERTIFICATE" | base64 --decode > "$SIGNING_DIR/certificate.p12"
          printf '%s' "$PROFILE" | base64 --decode > "$SIGNING_DIR/profile.mobileprovision"
          KEYCHAIN_PASSWORD=$(openssl rand -base64 32)
          echo "::add-mask::$KEYCHAIN_PASSWORD"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$SIGNING_DIR/build.keychain-db"
          security set-keychain-settings -lut 21600 "$SIGNING_DIR/build.keychain-db"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$SIGNING_DIR/build.keychain-db"
          security import "$SIGNING_DIR/certificate.p12" -P "$CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$SIGNING_DIR/build.keychain-db"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$SIGNING_DIR/build.keychain-db" >/dev/null
          security list-keychains -d user -s "$SIGNING_DIR/build.keychain-db" login.keychain-db
          IDENTITY=$(security find-identity -v -p codesigning "$SIGNING_DIR/build.keychain-db" | awk '/Apple Distribution|iPhone Distribution/ {print $2; exit}')
          test -n "$IDENTITY"
          security cms -D -i "$SIGNING_DIR/profile.mobileprovision" > "$SIGNING_DIR/profile.plist"
          python3 - "$SIGNING_DIR" <<'PY'
          import plistlib,sys,pathlib,datetime
          folder=pathlib.Path(sys.argv[1])
          profile=plistlib.loads((folder/'profile.plist').read_bytes())
          assert profile['Entitlements']['application-identifier']=='9Q6YL8R33R.app.avyro.companion'
          assert profile['ExpirationDate']>datetime.datetime.now(datetime.timezone.utc).replace(tzinfo=None)
          assert not profile['Entitlements'].get('get-task-allow',False)
          (folder/'entitlements.plist').write_bytes(plistlib.dumps(profile['Entitlements']))
          PY
          APP_PATH=build/Avyro.xcarchive/Products/Applications/meepmeep.app
          cp "$SIGNING_DIR/profile.mobileprovision" "$APP_PATH/embedded.mobileprovision"
          find "$APP_PATH" -type f -name '*.dylib' -print0 | while IFS= read -r -d '' item; do codesign --force --sign "$IDENTITY" --keychain "$SIGNING_DIR/build.keychain-db" --timestamp=none "$item"; done
          find "$APP_PATH" -type d -name '*.framework' -depth -print0 | while IFS= read -r -d '' item; do codesign --force --sign "$IDENTITY" --keychain "$SIGNING_DIR/build.keychain-db" --timestamp=none "$item"; done
          codesign --force --sign "$IDENTITY" --keychain "$SIGNING_DIR/build.keychain-db" --timestamp=none --generate-entitlement-der --entitlements "$SIGNING_DIR/entitlements.plist" "$APP_PATH"
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"
          mkdir -p build/ipa/Payload
          cp -R "$APP_PATH" build/ipa/Payload/
          (cd build/ipa && zip -qry "../Avyro-1.0.0-build${BUILD_NUMBER}.ipa" Payload)
      - name: Upload signed iPhone artifact
        uses: actions/upload-artifact@v4
        with:
          name: Avyro-signed-iPhone
          path: avyro/build/*.ipa
          retention-days: 2
      - name: Remove temporary signing material
        if: always()
        run: |
          SIGNING_DIR="$RUNNER_TEMP/avyro-signing"
          security delete-keychain "$SIGNING_DIR/build.keychain-db" 2>/dev/null || true
          if [ -d "$SIGNING_DIR" ]; then find "$SIGNING_DIR" -type f -delete; rmdir "$SIGNING_DIR"; fi
      - name: Upload build diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Avyro-device-build-diagnostics
          path: avyro/native-device-build.log
          retention-days: 2
