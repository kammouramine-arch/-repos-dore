name: Nova CI

# The Nova app lives in `nova/`; the repository root is a separate static site,
# so every step is scoped to that directory and the workflow only runs when
# something under it (or this file) changes.
on:
  push:
    branches: ['**']
    paths:
      - 'nova/**'
      - '.github/workflows/nova-ci.yml'
  pull_request:
    paths:
      - 'nova/**'
      - '.github/workflows/nova-ci.yml'

# A new push supersedes an in-flight run on the same branch.
concurrency:
  group: nova-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: nova

jobs:
  verify:
    name: Typecheck · Lint · Test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: nova/package-lock.json

      # `npm ci` rather than `npm install`: the lockfile is the contract, and a
      # CI run must fail on drift instead of quietly resolving around it.
      - name: Install dependencies
        run: npm ci

      # Each check runs even if an earlier one failed, so a single push reports
      # every problem at once rather than one per round trip.
      - name: Typecheck
        if: '!cancelled()'
        run: npm run typecheck

      - name: Lint
        if: '!cancelled()'
        run: npm run lint

      - name: Unit tests
        if: '!cancelled()'
        run: npm test -- --ci
