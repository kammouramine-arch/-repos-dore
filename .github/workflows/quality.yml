name: Quality checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: devisia
          POSTGRES_PASSWORD: devisia_test_only
          POSTGRES_DB: devisia_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgresql://devisia:devisia_test_only@127.0.0.1:5432/devisia_test
      E2E_DATABASE_URL: postgresql://devisia:devisia_test_only@127.0.0.1:5432/devisia_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            mobile/package-lock.json
      - run: npm ci
      - run: npm ci
        working-directory: mobile
      - run: npx prisma generate
      - run: npm test
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run typecheck && npm run lint
        working-directory: mobile
      - run: npx playwright install --with-deps chromium
      # Includes a fresh production web build and owned server teardown.
      - run: npm run test:e2e
      - run: npx expo export --platform ios --output-dir dist-ios-check-ci
        working-directory: mobile
        env:
          EAS_BUILD_PROFILE: production
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failure-evidence
          path: test-results/
          retention-days: 7
