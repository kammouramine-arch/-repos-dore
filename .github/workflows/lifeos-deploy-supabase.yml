name: LifeOS — deploy to Supabase

# Deploys the database and the edge functions to the Supabase project.
#
# This exists so deployment needs no terminal: add the three secrets once under
# Settings → Secrets and variables → Actions, then run this workflow from the
# Actions tab whenever the backend changes.
#
# Required repository secrets:
#   SUPABASE_ACCESS_TOKEN   Supabase dashboard → Account → Access Tokens
#   SUPABASE_PROJECT_REF    The project ref from the project's URL
#   SUPABASE_DB_PASSWORD    The database password chosen when the project was created
#
# The function secrets themselves (Anthropic key, store credentials) are set in the
# Supabase dashboard, not here — they are never needed by this workflow.
on:
  workflow_dispatch:
    inputs:
      deploy_database:
        description: 'Apply database migrations'
        type: boolean
        default: true
      deploy_functions:
        description: 'Deploy edge functions'
        type: boolean
        default: true

defaults:
  run:
    working-directory: lifeos

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4

      - name: Check the secrets are present
        run: |
          missing=0
          for name in SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD PROJECT_REF; do
            if [ -z "${!name}" ]; then echo "::error::Repository secret $name is not set."; missing=1; fi
          done
          [ "$missing" = "0" ] || exit 1

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link the project
        run: supabase link --project-ref "$PROJECT_REF"

      - name: Apply migrations
        if: ${{ inputs.deploy_database }}
        run: supabase db push

      # The stores cannot send an Authorization header, so the notification endpoint
      # is deployed without JWT verification and authenticates by its own secret.
      - name: Deploy edge functions
        if: ${{ inputs.deploy_functions }}
        run: |
          supabase functions deploy ai-chat transcribe daily-brief subscription-verify
          supabase functions deploy store-notifications --no-verify-jwt

      - name: Summary
        run: |
          {
            echo "### LifeOS deployed"
            echo ""
            echo "- Database migrations: ${{ inputs.deploy_database }}"
            echo "- Edge functions: ${{ inputs.deploy_functions }}"
            echo ""
            echo "Next: run \`supabase/tests/verify.sql\` in the SQL Editor to confirm the database."
          } >> "$GITHUB_STEP_SUMMARY"
