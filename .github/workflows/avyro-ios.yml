name: Avyro native iOS validation
on:
  push:
    branches: [chatgpt/avyro-v2-foundation-20261013]
    paths: ['avyro/**', '.github/workflows/avyro-ios.yml']
  workflow_dispatch:
    inputs:
      simulator_run:
        description: Existing successful compile run to reuse for UI-only checks
        required: false
        type: string
      ui_flow:
        description: Native interaction suite
        type: choice
        default: guest-map
        options: [guest-map, location-smoke]
permissions:
  contents: read
concurrency:
  group: avyro-ios-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true
jobs:
  ios:
    runs-on: macos-26
    timeout-minutes: 60
    env:
      EXPO_PUBLIC_BACKEND_URL: https://avyro-gateway.avyro-cloud-gateway.workers.dev
      EXPO_PUBLIC_ROAD_DATA_ENABLED: 'true'
      EXPO_PUBLIC_NATIVE_DIAGNOSTICS: 'true'
    defaults:
      run:
        working-directory: avyro
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: avyro/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npx expo prebuild --platform ios --no-install
        if: ${{ !inputs.simulator_run }}
      - run: pod install --project-directory=ios
        if: ${{ !inputs.simulator_run }}
      - name: Build Release for the iOS simulator
        if: ${{ !inputs.simulator_run }}
        run: |
          set -o pipefail
          xcodebuild -workspace ios/Avyro.xcworkspace -scheme Avyro -configuration Release -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath build CODE_SIGNING_ALLOWED=NO > native-build.log 2>&1 || { tail -n 120 native-build.log; exit 1; }
          ditto -c -k --keepParent build/Build/Products/Release-iphonesimulator/Avyro.app build/Avyro-simulator.zip
      - name: Upload simulator app
        if: ${{ !inputs.simulator_run }}
        uses: actions/upload-artifact@v4
        with:
          name: Avyro-iOS-simulator
          path: avyro/build/Avyro-simulator.zip
      - uses: actions/download-artifact@v4
        if: ${{ inputs.simulator_run }}
        with:
          name: Avyro-iOS-simulator
          run-id: ${{ inputs.simulator_run }}
          github-token: ${{ github.token }}
          path: avyro/build
      - name: Unpack existing simulator app
        if: ${{ inputs.simulator_run }}
        run: |
          mkdir -p build/Build/Products/Release-iphonesimulator
          ditto -x -k build/Avyro-simulator.zip build/Build/Products/Release-iphonesimulator
      - name: Embed configured JavaScript into reused simulator app
        if: ${{ inputs.simulator_run }}
        run: |
          npx expo export:embed --entry-file index.ts --platform ios --dev false --bytecode --bundle-output build/Build/Products/Release-iphonesimulator/Avyro.app/main.jsbundle --assets-dest build/Build/Products/Release-iphonesimulator/Avyro.app
      - name: Verify guest launch and capture native screens
        env:
          MAESTRO_CLI_NO_ANALYTICS: 1
          MAESTRO_DRIVER_STARTUP_TIMEOUT: 600000
        run: |
          brew install mobile-dev-inc/tap/maestro
          DEVICE_ID=$(python3 -c 'import json,subprocess; d=json.loads(subprocess.check_output(["xcrun","simctl","list","devices","available","--json"])); print(next(x["udid"] for group in d["devices"].values() for x in group if "iPhone" in x["name"]))')
          xcrun simctl boot "$DEVICE_ID"
          xcrun simctl bootstatus "$DEVICE_ID" -b
          xcrun simctl ui "$DEVICE_ID" appearance light
          xcrun simctl status_bar "$DEVICE_ID" override --time 9:41 --dataNetwork wifi --wifiMode active --wifiBars 3 --batteryState charged --batteryLevel 100
          xcrun simctl install "$DEVICE_ID" build/Build/Products/Release-iphonesimulator/Avyro.app
          xcrun simctl location "$DEVICE_ID" set 48.85653,2.35332
          mkdir -p build/screens
          # A slow sub-metre simulator path supplies fresh fixes and valid native
          # speed (rounding to zero). Static `set` fixes have unknown native speed.
          (
            xcrun simctl help location
            while true; do
              xcrun simctl location "$DEVICE_ID" start --speed=0.01 --interval=1 48.8565300,2.35332 48.8565350,2.35332
              sleep 40
              xcrun simctl location "$DEVICE_ID" start --speed=0.01 --interval=1 48.8565350,2.35332 48.8565300,2.35332
              sleep 40
            done
          ) > build/location-fixture.log 2>&1 &
          AVYRO_LOCATION_PID=$!
          xcrun simctl io "$DEVICE_ID" recordVideo --codec=h264 build/screens/native-walkthrough.mp4 > build/recording.log 2>&1 &
          AVYRO_RECORD_PID=$!
          trap 'kill "$AVYRO_LOCATION_PID" 2>/dev/null || true; kill -INT "$AVYRO_RECORD_PID" 2>/dev/null || true; wait "$AVYRO_RECORD_PID" 2>/dev/null || true' EXIT
          AVYRO_UI_FLOW="${{ inputs.ui_flow || 'guest-map' }}"
          [[ "$AVYRO_UI_FLOW" == guest-map || "$AVYRO_UI_FLOW" == location-smoke ]] || exit 1
          maestro --device "$DEVICE_ID" test ".maestro/$AVYRO_UI_FLOW.yaml"
      - name: Capture final simulator state
        if: always()
        run: |
          mkdir -p build/screens
          xcrun simctl io booted screenshot build/screens/final-state.png || true
          xcrun simctl spawn booted log show --last 20m --style compact --predicate 'eventMessage CONTAINS "AVYRO_GPS_TEST"' > build/gps-fixture.log 2>&1 || true
      - name: Upload native UI captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Avyro-native-UI
          include-hidden-files: true
          path: |
            avyro/**/screens/*.png
            avyro/**/screens/*.mp4
            avyro/build/gps-fixture.log
            avyro/build/location-fixture.log
            avyro/build/recording.log
            /Users/runner/.maestro/tests/
          if-no-files-found: ignore
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Avyro-native-build-log
          path: avyro/native-build.log
          if-no-files-found: ignore
