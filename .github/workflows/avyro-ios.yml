name: Avyro native iOS validation
on:
  push:
    branches: [chatgpt/avyro-v2-foundation-20261013]
    paths: ['avyro/**', '.github/workflows/avyro-ios.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: avyro-ios-${{ github.ref }}
  cancel-in-progress: true
jobs:
  ios:
    runs-on: macos-26
    timeout-minutes: 60
    defaults:
      run:
        working-directory: avyro
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: avyro/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npx expo prebuild --platform ios --no-install
      - run: pod install --project-directory=ios
      - name: Build Release for the iOS simulator
        run: |
          set -o pipefail
          xcodebuild -workspace ios/Avyro.xcworkspace -scheme Avyro -configuration Release -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath build CODE_SIGNING_ALLOWED=NO > native-build.log 2>&1 || { tail -n 120 native-build.log; exit 1; }
          ditto -c -k --keepParent build/Build/Products/Release-iphonesimulator/Avyro.app build/Avyro-simulator.zip
      - name: Upload simulator app
        uses: actions/upload-artifact@v4
        with:
          name: Avyro-iOS-simulator
          path: avyro/build/Avyro-simulator.zip
      - name: Verify guest launch and capture native screens
        run: |
          brew install mobile-dev-inc/tap/maestro
          DEVICE_ID=$(python3 -c 'import json,subprocess; d=json.loads(subprocess.check_output(["xcrun","simctl","list","devices","available","--json"])); print(next(x["udid"] for group in d["devices"].values() for x in group if "iPhone" in x["name"]))')
          xcrun simctl boot "$DEVICE_ID"
          xcrun simctl bootstatus "$DEVICE_ID" -b
          xcrun simctl ui "$DEVICE_ID" appearance light
          xcrun simctl status_bar "$DEVICE_ID" override --time 9:41 --dataNetwork wifi --wifiMode active --wifiBars 3 --batteryState charged --batteryLevel 100
          xcrun simctl install "$DEVICE_ID" build/Build/Products/Release-iphonesimulator/Avyro.app
          xcrun simctl location "$DEVICE_ID" set 48.8566,2.3522
          mkdir -p build/screens
          maestro --device "$DEVICE_ID" test .maestro/guest-map.yaml
      - name: Upload native UI captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Avyro-native-UI
          path: avyro/build/screens/
          if-no-files-found: ignore
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Avyro-native-build-log
          path: avyro/native-build.log
          if-no-files-found: ignore
